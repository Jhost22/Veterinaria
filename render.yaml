# Blueprint de Render: crea la base de datos PostgreSQL y el backend NestJS.
# El frontend NO va aquí: se despliega en Vercel (ver README).
databases:
  - name: veterinaria-db
    databaseName: veterinaria
    user: veterinaria
    plan: free

services:
  - type: web
    name: veterinaria-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: veterinaria-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DB_SYNC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Render te pedirá estos valores al crear el Blueprint:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
